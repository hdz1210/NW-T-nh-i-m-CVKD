<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup setting Quỹ Chéo</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"><style>
    /* =========================================================================
       1. DESIGN SYSTEM TOKENS (IMPECCABLE PRECISION THEME)
       ========================================================================= */
    :root {
      --brand: #1d4ed8;
      --brand-hover: #1e40af;
      --brand-subtle: #eff6ff;
      --brand-border: #bfdbfe;

      --bg-canvas: #f8fafc;
      --bg-surface: #ffffff;
      --bg-muted: #f1f5f9;
      --bg-hover: #f8fafc;

      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-tertiary: #64748b;
      --text-inverse: #ffffff;

      --border-subtle: #e2e8f0;
      --border-strong: #cbd5e1;

      --success: #047857;
      --success-hover: #065f46;
      --success-subtle: #ecfdf5;
      --success-text: #065f46;

      --danger: #b91c1c;
      --danger-hover: #991b1b;
      --danger-subtle: #fef2f2;
      --danger-text: #991b1b;

      --warning: #b45309;
      --warning-subtle: #fffbeb;
      --warning-text: #92400e;

      --purple-subtle: #faf5ff;
      --purple-text: #7e22ce;
      --purple-border: #e9d5ff;

      --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.1), 0 2px 4px -2px rgba(15, 23, 42, 0.06);
      --shadow-popover: 0 10px 15px -3px rgba(15, 23, 42, 0.12), 0 4px 6px -2px rgba(15, 23, 42, 0.04);

      --font-sans: 'Manrope', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --text-xs: 11px;
      --text-sm: 13px;
      --text-base: 14px;
      --text-md: 16px;
      --text-lg: 20px;

      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-full: 9999px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      font-size: var(--text-base);
      color: var(--text-primary);
      background-color: var(--bg-canvas);
      line-height: 1.5;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* Container */
    .app-container {
      max-width: 1380px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    .app-header {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-titles {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .app-title {
      font-size: var(--text-lg);
      font-weight: 800;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .commit-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      vertical-align: middle;
      user-select: all;
    }

    .commit-text {
      color: var(--brand, #1d4ed8);
      font-weight: 600;
      font-size: 13px;
    }

    .commit-hash {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 2px 8px;
      border-radius: 6px;
      font-family: var(--font-mono, monospace);
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: 0.5px;
    }

    .app-subtitle {
      font-size: var(--text-sm);
      color: var(--text-tertiary);
    }

    /* KPI Metrics Deck */
    .kpi-deck {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    @media (max-width: 1200px) {
      .kpi-deck {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    @media (max-width: 768px) {
      .kpi-deck {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Campaign Control Card & Styling */
    .campaign-control-card {
      background: linear-gradient(135deg, #fffaf5 0%, #ffffff 100%);
      border: 1.5px solid #fdba74;
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      box-shadow: 0 2px 6px rgba(234, 88, 12, 0.08);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .campaign-control-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .campaign-form-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .campaign-field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .campaign-field-label {
      font-size: var(--text-xs);
      font-weight: 700;
      color: #9a3412;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .cell-score-campaign {
      border-color: #fb923c !important;
      background: #fff7ed !important;
      color: #c2410c !important;
      font-weight: 800 !important;
    }
    .cell-score-campaign:focus {
      border-color: #ea580c !important;
      box-shadow: 0 0 0 2px rgba(234, 88, 12, 0.2) !important;
    }

    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      box-shadow: var(--shadow-xs);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .kpi-label {
      font-size: var(--text-xs);
      font-weight: 700;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .kpi-value {
      font-size: var(--text-lg);
      font-weight: 800;
      font-family: var(--font-mono);
      color: var(--text-primary);
    }

    .kpi-highlight-brand { color: var(--brand); }
    .kpi-highlight-success { color: var(--success); }
    .kpi-highlight-warning { color: var(--warning); }

    /* Tab Switcher */
    .tab-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid var(--border-subtle);
      padding-bottom: 2px;
    }

    .tab-btn {
      padding: 8px 16px;
      font-size: var(--text-base);
      font-weight: 700;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      border-radius: var(--radius-md) var(--radius-md) 0 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
      position: relative;
    }

    .tab-btn:hover {
      color: var(--brand);
      background: var(--brand-subtle);
    }

    .tab-btn.active {
      color: var(--brand);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-bottom: 2px solid var(--bg-surface);
      margin-bottom: -3px;
      box-shadow: var(--shadow-xs);
    }

    .tab-badge {
      font-size: var(--text-xs);
      font-weight: 800;
      padding: 2px 6px;
      border-radius: var(--radius-full);
      background: var(--bg-muted);
      color: var(--text-secondary);
    }

    .tab-btn.active .tab-badge {
      background: var(--brand-subtle);
      color: var(--brand);
    }

    /* Toolbar Controls */
    .toolbar-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      box-shadow: var(--shadow-xs);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .toolbar-filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-input, .filter-select {
      height: 36px;
      padding: 6px 12px;
      font-size: var(--text-sm);
      font-family: var(--font-sans);
      color: var(--text-primary);
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .filter-input:focus, .filter-select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.15);
    }

    .filter-input {
      width: 240px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
      padding: 0 14px;
      font-size: var(--text-sm);
      font-weight: 700;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background-color: var(--brand);
      color: var(--text-inverse);
      box-shadow: var(--shadow-xs);
    }
    .btn-primary:hover {
      background-color: var(--brand-hover);
    }

    .btn-secondary {
      background-color: var(--bg-surface);
      color: var(--text-secondary);
      border-color: var(--border-strong);
    }
    .btn-secondary:hover {
      background-color: var(--bg-muted);
      color: var(--text-primary);
    }

    .btn-success {
      background-color: var(--success);
      color: var(--text-inverse);
    }
    .btn-success:hover {
      background-color: var(--success-hover);
    }

    .btn-warning {
      background-color: var(--warning);
      color: var(--text-inverse);
    }

    .btn-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1px 6px;
      font-size: var(--text-xs);
      font-weight: 800;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.25);
      color: var(--text-inverse);
    }

    /* Table Container */
    .table-container {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .table-scroll-wrapper {
      max-height: 520px;
      overflow: auto;
      position: relative;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: var(--text-sm);
    }

    thead {
      position: sticky;
      top: 0;
      z-index: 10;
    }

    th {
      background-color: var(--bg-muted);
      color: var(--text-secondary);
      font-weight: 700;
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 10px 12px;
      border-bottom: 2px solid var(--border-strong);
      border-right: 1px solid var(--border-subtle);
      white-space: nowrap;
      text-align: left;
    }

    th.th-month {
      background-color: var(--brand-subtle);
      color: var(--brand);
      text-align: center;
      min-width: 85px;
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      font-weight: 800;
    }

    th.th-month.th-latest {
      background-color: #dbeafe;
      color: #1e3a8a;
      border-left: 2px solid var(--brand);
      border-right: 2px solid var(--brand);
    }

    td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-subtle);
      border-right: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
      vertical-align: middle;
      color: var(--text-primary);
    }

    tr:hover td {
      background-color: #f8fafc;
    }

    /* Freeze Columns */
    th.freeze-col, td.freeze-col {
      position: sticky;
      left: 0;
      width: 42px;
      min-width: 42px;
      max-width: 42px;
      z-index: 4;
      text-align: center;
      background-color: #ffffff !important;
    }
    th.freeze-col-actions, td.freeze-col-actions {
      position: sticky;
      left: 42px;
      width: 106px;
      min-width: 106px;
      max-width: 106px;
      z-index: 4;
      text-align: center;
      background-color: #ffffff !important;
      padding: 4px 6px !important;
    }
    th.freeze-col-2, td.freeze-col-2 {
      position: sticky;
      left: 148px;
      z-index: 4;
      background-color: #ffffff !important;
      border-right: 2px solid #cbd5e1 !important;
      box-shadow: 2px 0 4px rgba(15, 23, 42, 0.06);
    }

    tr:hover td.freeze-col, 
    tr:hover td.freeze-col-actions, 
    tr:hover td.freeze-col-2 {
      background-color: #f8fafc !important;
    }

    thead th.freeze-col, thead th.freeze-col-actions, thead th.freeze-col-2 {
      z-index: 25 !important;
      background-color: #f1f5f9 !important;
      border-bottom: 2px solid #cbd5e1;
    }

    /* Action Buttons */
    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      min-width: 26px;
      max-width: 26px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s ease;
      padding: 0;
      margin: 0;
      flex-shrink: 0;
    }
    .btn-action:hover {
      background: var(--bg-muted);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }
    .btn-action-edit:hover {
      background: var(--primary-50);
      border-color: var(--primary-500);
    }
    .btn-action-flame {
      color: #ea580c;
      border-color: #fdba74;
      background: #fff7ed;
    }
    .btn-action-flame:hover {
      background: #ffedd5;
      border-color: #ea580c;
      color: #c2410c;
    }
    .btn-action-del:hover {
      background: #fef2f2;
      border-color: #ef4444;
    }

    /* Cell Score Input */
    .cell-score-input {
      width: 68px;
      height: 28px;
      padding: 2px 6px;
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      font-weight: 700;
      text-align: center;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-primary);
      transition: all 0.15s ease;
    }

    .cell-score-input:hover {
      border-color: var(--border-strong);
      background: var(--bg-muted);
    }

    .cell-score-input:focus {
      outline: none;
      border-color: var(--brand);
      background: var(--bg-surface);
      box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.2);
    }

    .cell-modified {
      background-color: #fef9c3 !important;
      border-color: #eab308 !important;
      color: #713f12 !important;
      font-weight: 800 !important;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      font-size: var(--text-xs);
      font-weight: 700;
      border-radius: var(--radius-full);
      white-space: nowrap;
    }

    .badge-selling { background: var(--success-subtle); color: var(--success-text); }
    .badge-soldout { background: var(--bg-muted); color: var(--text-tertiary); }
    .badge-fund-nw { background: var(--brand-subtle); color: var(--brand); }
    .badge-fund-cross { background: var(--purple-subtle); color: var(--purple-text); border: 1px solid var(--purple-border); }
    .badge-condition {
      background: #f1f5f9;
      color: #334155;
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 1px 6px;
      border-radius: var(--radius-sm);
      border: 1px solid #e2e8f0;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      min-width: 320px;
      padding: 12px 18px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: var(--text-sm);
      display: none;
      box-shadow: var(--shadow-popover);
      animation: slideIn 0.2s ease-out;
    }
    .toast-success { background: var(--success-subtle); color: var(--success-text); border: 1px solid #a7f3d0; }
    .toast-error   { background: var(--danger-subtle); color: var(--danger-text); border: 1px solid #fecaca; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Loading Overlay */
    .loading-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(2px);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border-subtle);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.5);
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-popover);
      width: 660px;
      max-width: 94vw;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: slideIn 0.15s ease-out;
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
    }

    .form-row-3 {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 0.8fr);
      gap: 10px;
    }

    /* Custom Autocomplete Dropdown */
    .autocomplete-container {
      position: relative;
      width: 100%;
    }
    .autocomplete-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      z-index: 1050;
      display: none;
      flex-direction: column;
      box-sizing: border-box;
    }
    .autocomplete-item {
      padding: 7px 10px;
      cursor: pointer;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      gap: 2px;
      transition: background 0.12s ease;
      text-align: left;
    }
    .autocomplete-item:last-child {
      border-bottom: none;
    }
    .autocomplete-item:hover {
      background: var(--primary-50);
    }
    .autocomplete-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--brand);
    }
    .autocomplete-sub {
      font-size: 11px;
      color: var(--text-secondary);
    }

    /* Campaign Combobox Dropdown */
    .campaign-combobox {
      position: relative;
      width: 100%;
    }
    .campaign-combobox input,
    .campaign-combobox input.filter-input {
      width: 100% !important;
      box-sizing: border-box !important;
      padding-right: 36px !important;
    }
    .campaign-combobox-arrow {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      background: #fed7aa;
      font-size: 10px;
      color: #9a3412;
      cursor: pointer;
      user-select: none;
      z-index: 2;
      line-height: 1;
      transition: all 0.15s ease;
    }
    .campaign-combobox-arrow:hover {
      background: #fdba74;
      color: #7c2d12;
    }
    .campaign-combobox-arrow.open {
      transform: translateY(-50%) rotate(180deg);
      background: #fdba74;
    }
    .campaign-combobox-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      width: 100%;
      max-height: 240px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid #fdba74;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 30px rgba(154, 52, 18, 0.12);
      z-index: 1060;
      display: none;
      flex-direction: column;
      box-sizing: border-box;
    }
    .campaign-combobox-dropdown.show {
      display: flex;
    }
    .campaign-dd-item {
      padding: 8px 12px;
      cursor: pointer;
      border-bottom: 1px solid #fff7ed;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.12s ease;
      text-align: left;
    }
    .campaign-dd-item:last-child {
      border-bottom: none;
    }
    .campaign-dd-item:hover {
      background: #fff7ed;
    }
    .campaign-dd-item.active {
      background: #ffedd5;
    }
    .campaign-dd-item-new {
      color: #059669;

body{padding:0;background:#eef2f6}

</style></head><body><div class="modal-backdrop" id="addRowModal" style="display: flex;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="modalAddTitle">Thêm Dự Án / Cấu Hình Điểm (Quỹ Chéo)</h3>
        <button type="button" class="modal-close">×</button>
      </div>
      <div class="modal-body" id="modalAddBody">
        <div class="form-group" style="background: var(--bg-muted); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 10px 14px;">
          <label class="field-label" for="addFundType" style="color: var(--primary-600); font-weight: 800; font-size: 11px; margin-bottom: 6px;">
            BƯỚC 1: CHỌN LOẠI QUỸ DỰ ÁN (*)
          </label>
          <select class="filter-select" id="addFundType" style="width:100%; font-size: 13px; font-weight: 700; height: 38px; border-color: var(--primary-500); background: #ffffff;">
            <option value="th">Quỹ NW (Rule Quỹ NW - Tính Điểm Theo Dự Án &amp; Điều Kiện)</option>
            <option value="f2" selected="">Quỹ Chéo (Rule Quỹ Chéo - Điểm Quỹ Chéo Độc Lập)</option>
            
          </select>
        </div>
        <div id="fundFormContainer" style="display: flex; flex-direction: column; gap: 12px;">
          <!-- Tên Dự Án F2 Multi-select Droplist -->
          <div class="form-group" style="position: relative;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
              <label class="field-label" style="margin-bottom:0; font-weight:700;">Tên Dự Án F2 <span style="color:var(--danger)">*</span></label>
              <span style="font-size:10px; color:var(--text-tertiary);">Chọn 1, nhiều hoặc Tất cả</span>
            </div>
            <div class="multi-select-container" id="addDuAnF2Container">
              <div class="multi-select-trigger" id="addDuAnF2Trigger">
                <span class="multi-select-label" id="addDuAnF2Label" style="color: var(--text-primary);">Tất cả (Mọi dự án F2)</span>
                <span class="multi-select-arrow">▼</span>
              </div>
              <div class="multi-select-dropdown" id="addDuAnF2Dropdown" style="min-width: 320px;">
                <div class="multi-select-search-box">
                  <input type="text" class="multi-select-search" id="addDuAnF2Search" placeholder="Tìm tên dự án F2...">
                </div>
                <div class="multi-select-actions">
                  <span class="multi-select-btn-link">Chọn tất cả</span>
                  <span class="multi-select-btn-link">Bỏ chọn</span>
                </div>
                <div class="multi-select-options" id="addDuAnF2Options">
        <label class="multi-select-option" data-text="tất cả all *" style="border-bottom: 1px solid var(--border-subtle); padding-bottom: 6px; margin-bottom: 4px; font-weight: 700;">
          <input type="checkbox" class="add-duanf2-cb" id="addDuAnF2CbAll" value="Tất cả" checked="">
          <span>Tất cả dự án F2 (Toàn bộ)</span>
        </label>
      </div>
                <div class="multi-select-custom-box">
                  <input type="text" id="addCustomDuAnF2Input" class="multi-select-search" placeholder="+ Nhập tên dự án F2 mới...">
                  <button type="button" class="btn btn-secondary" style="height:26px; padding:0 8px; font-size:11px;">+ Thêm</button>
                </div>
              </div>
            </div>
            <input type="hidden" id="addNameF2" value="Tất cả">
          </div>

          <!-- Khoảng Giá (Tỷ VNĐ) -->
          <div class="form-group" style="margin-bottom:0;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
              <label class="field-label" style="margin-bottom:0; font-weight:700;">3. Khoảng Giá (tỷ VNĐ)</label>
              <span id="addF2KhoangGiaPreview" style="font-size:11px; font-weight:800; color:var(--text-tertiary); background:var(--bg-muted); padding:2px 8px; border-radius:4px; border:1px solid var(--border-subtle);">Tất cả</span>
            </div>
            <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--bg-surface); padding:8px 12px; border:1px solid var(--border-subtle); border-radius:var(--radius-md);" class="price-controls">
              <div style="display:flex; align-items:center; gap:6px; flex:1;">
                <span style="font-size:12px; font-weight:700; color:var(--text-secondary); white-space:nowrap;">Từ (Min):</span>
                <input type="number" step="0.5" min="0" max="999" class="filter-input" style="flex:1; width:100%; min-width:55px; height:32px; padding:4px 8px; font-weight:700;" id="addF2GiaTu" placeholder="0" value="50">
                <span style="font-size:11px; color:var(--text-tertiary);">tỷ</span>
              </div>
              <span style="color:var(--text-tertiary); font-weight:700; padding:0 2px;">—</span>
              <div style="display:flex; align-items:center; gap:6px; flex:1;">
                <span style="font-size:12px; font-weight:700; color:var(--text-secondary); white-space:nowrap;">Đến (Max):</span>
                <input type="number" step="0.5" min="0" max="999" class="filter-input" style="flex:1; width:100%; min-width:55px; height:32px; padding:4px 8px; font-weight:700;" id="addF2GiaDen" placeholder="999" value="999">
                <span style="font-size:11px; color:var(--text-tertiary);">tỷ</span>
              </div>
              <div style="height:20px; width:1px; background:var(--border-subtle); margin:0 4px;"></div>
              <label style="font-size:11px; font-weight:600; display:inline-flex; align-items:center; gap:6px; cursor:pointer; color:var(--text-secondary); white-space:nowrap; margin-bottom:0;">
                <input type="checkbox" id="addF2IsDat" style="cursor:pointer;">
                <span>Chỉ tính tiền đất (VHHVB)</span>
              </label>
            </div>
            <input type="hidden" id="addF2KhoangGiaInput" value="Tất cả">
          </div>



          <!-- Cấu hình điểm & Tháng áp dụng -->
          <div style="background: var(--bg-muted); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 12px; display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; justify-content: space-between; align-items: center;" class="score-heading">
              <span style="font-size: var(--text-xs); font-weight: 800; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px;">
                CẤU HÌNH ĐIỂM &amp; THỜI GIAN ÁP DỤNG
              </span>
              <span id="addF2ScoreMonthBadge" class="badge" style="background:#fff7ed; color:#9a3412; border:1px solid #fdba74; font-weight:700;">⚡ CHỈ THÁNG 09/2026 (BẢO TOÀN THÁNG CŨ)</span>
            </div><div class="progressive-tabs" role="tablist" aria-label="Cách tính điểm"><button type="button" class="tab-btn" id="proposalFixed" role="tab" aria-selected="false">Điểm cố định</button><button type="button" class="tab-btn active" id="proposalProgressive" role="tab" aria-selected="true" aria-controls="proposalProgressiveFields">Lũy tiến theo giá</button></div>
            <div class="form-row-2">
              <div class="form-group" style="margin-bottom:0;">
                <label class="field-label" for="addF2ScoreMonth" style="font-weight:700; color:var(--text-secondary);">Tháng Áp Dụng Rule <span style="color:var(--danger)">*</span></label>
                <select class="filter-select" id="addF2ScoreMonth" style="width:100%; height:36px; font-weight:700; background:#ffffff;">
                  <option value="2026-09-01" selected="">🔒 Chỉ Tháng 09/2026 (MỚI NHẤT - Bảo toàn tháng cũ)</option>
                  <option value="ALL">⚠️ Tất cả các tháng (Áp dụng đồng loạt)</option>
                </select>
              </div>
              <div class="form-group" style="margin-bottom:0;">
                <label class="field-label" for="addScoreF2" style="font-weight:800; color:var(--text-primary);">Điểm Cơ Sở <span style="color:var(--danger)">*</span></label>
                <input type="number" step="0.5" class="filter-input" style="width:100%; height:36px; font-weight:800; font-size:15px; text-align:center;" id="addScoreF2" placeholder="Ví dụ: 3.0" value="5">
              </div>
            </div>
          <div class="form-row-2 progressive-fields" id="proposalProgressiveFields" role="tabpanel" aria-labelledby="proposalProgressive"><div class="form-group"><label class="field-label" for="proposalStep">Mỗi (tỷ VNĐ) <span style="color:var(--danger)">*</span></label><input type="number" min="0.01" step="0.5" class="filter-input" id="proposalStep" value="10"></div><div class="form-group"><label class="field-label" for="proposalExtra">Cộng thêm (điểm) <span style="color:var(--danger)">*</span></label><input type="number" min="0.01" step="0.5" class="filter-input" id="proposalExtra" value="1"></div></div><div class="proposal-error" id="proposalError" role="alert"></div></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary">Hủy</button>
        <button type="button" class="btn btn-primary">Thêm Ngay</button>
      </div>
    </div>
  </div><script>
const isF2=document.getElementById('addFundType').value==='f2';
const prefix=isF2?'addF2':'add';
const minEl=document.getElementById(prefix+'GiaTu');
const maxEl=document.getElementById(prefix+'GiaDen');
const priceLabel=document.getElementById(prefix+'KhoangGiaPreview');
const scoreEl=document.getElementById(isF2?'addScoreF2':'addScore');
const stepEl=document.getElementById('proposalStep');
const extraEl=document.getElementById('proposalExtra');
let progressive=true;
function updateProposal(){
  const min=Number(minEl.value),max=Number(maxEl.value);
  let range=progressive?(max>=999?'> '+min:min+' < Giá ≤ '+max):(min<=0&&max>=999?'Tất cả':min===max?'= '+min:min<=0?'< '+max:max>=999?'>= '+min:min+' - '+max);
  if(document.getElementById(prefix+'IsDat').checked&&range!=='Tất cả')range='Giá đất '+range;
  priceLabel.textContent=range;
  priceLabel.style.color=range==='Tất cả'?'var(--text-tertiary)':'#92400e';
  priceLabel.style.background=range==='Tất cả'?'var(--bg-muted)':'#fef3c7';
  priceLabel.style.borderColor=range==='Tất cả'?'var(--border-subtle)':'#fde68a';
  const inputs=[minEl,maxEl,scoreEl,...(progressive?[stepEl,extraEl]:[])];
  const blank=inputs.some(el=>el.value==='');
  const invalid=inputs.some(el=>el.value!==''&&(!Number.isFinite(Number(el.value))||Number(el.value)<0))||min>=999||max>999||(max<999&&(progressive?max<=min:max<min))||(progressive&&(Number(stepEl.value)<=0||Number(extraEl.value)<=0));
  const invalidMonth=progressive&&document.getElementById(prefix+'ScoreMonth').value==='ALL';
  document.getElementById('proposalError').textContent=invalidMonth?'Vui lòng chọn một tháng áp dụng cụ thể.':invalid?'Kiểm tra khoảng giá, bước tăng và điểm cộng.':'';
  document.querySelector('.modal-footer .btn-primary').disabled=invalid||invalidMonth||blank;
}
function setMode(on){
  progressive=on;
  document.getElementById('proposalFixed').classList.toggle('active',!on);
  document.getElementById('proposalProgressive').classList.toggle('active',on);
  document.getElementById('proposalFixed').setAttribute('aria-selected',String(!on));
  document.getElementById('proposalProgressive').setAttribute('aria-selected',String(on));
  document.getElementById('proposalProgressiveFields').hidden=!on;
  const allOption=document.querySelector('#'+prefix+'ScoreMonth option[value="ALL"]');
  if(allOption)allOption.disabled=on;
  updateProposal();
}
document.getElementById('proposalFixed').addEventListener('click',()=>setMode(false));
document.getElementById('proposalProgressive').addEventListener('click',()=>setMode(true));
document.querySelectorAll('input').forEach(el=>el.addEventListener('input',updateProposal));
document.getElementById(prefix+'ScoreMonth').addEventListener('change',updateProposal);
document.getElementById('addFundType').addEventListener('change',event=>location.href=event.target.value==='f2'?'mockup-f2.html':'mockup.html');
document.querySelectorAll('.modal-close,.modal-footer .btn-secondary').forEach(el=>el.addEventListener('click',()=>document.getElementById('addRowModal').style.display='none'));
document.querySelector('.modal-footer .btn-primary').addEventListener('click',()=>alert('Mockup: chưa ghi dữ liệu vào Google Sheets.'));
setMode(true);
</script></body></html>
