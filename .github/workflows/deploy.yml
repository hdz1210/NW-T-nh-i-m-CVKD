name: Deploy to Google Apps Script

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Clasp
        run: npm install -g @google/clasp

      - name: Test scoring and IMPORTRANGE synchronization
        run: npm test

      - name: Authenticate with Google
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          echo "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Inject Git Commit Version
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_TIME=$(TZ="Asia/Ho_Chi_Minh" date +"%Y-%m-%d %H:%M:%S")
          echo "Injecting version: $COMMIT_HASH built at $BUILD_TIME"
          node scripts/inject-version.mjs "$COMMIT_HASH" "$BUILD_TIME"

      - name: Push code to Apps Script
        run: clasp push --force
