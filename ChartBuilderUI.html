<!DOCTYPE html>
<html lang="vi">

<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trình Tạo Biểu Đồ & Báo Cáo Phân Tích (BI Chart Builder)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet">
  <style>
    /* =========================================================================
       1. DESIGN SYSTEM TOKENS (IMPECCABLE PRECISION THEME)
       ========================================================================= */
    :root {
      --brand: #1d4ed8;
      --brand-hover: #1e40af;
      --brand-subtle: #eff6ff;
      --brand-border: #bfdbfe;

      --bg-canvas: #f8fafc;
      --bg-surface: #ffffff;
      --bg-muted: #f1f5f9;
      --bg-hover: #f8fafc;

      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-tertiary: #475569;
      --text-inverse: #ffffff;

      --border-subtle: #e2e8f0;
      --border-strong: #cbd5e1;

      --success: #047857;
      --success-hover: #065f46;
      --success-subtle: #ecfdf5;
      --success-text: #065f46;

      --danger: #b91c1c;
      --danger-subtle: #fef2f2;
      --danger-text: #991b1b;

      --warning: #b45309;
      --warning-subtle: #fffbeb;
      --warning-text: #92400e;

      --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.1), 0 2px 4px -2px rgba(15, 23, 42, 0.06);

      --font-sans: 'Manrope', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --text-xs: 11px;
      --text-base: 14px;
      --text-md: 18px;
      --text-lg: 24px;

      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-full: 9999px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: var(--text-base);
      line-height: 1.5;
      padding: 14px 18px;
      -webkit-font-smoothing: antialiased;
    }

    /* App Header */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .app-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-title {
      font-size: var(--text-lg);
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-badge {
      font-size: var(--text-xs);
      font-weight: 700;
      background: #e0e7ff;
      color: #312e81;
      padding: 3px 10px;
      border-radius: var(--radius-full);
    }

    /* Layout 2 Cột: Config Bên Trái (340px) & Preview Bên Phải (Flex) */
    .builder-layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
      align-items: start;
    }

    .card {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-sm);
      padding: 16px;
      margin-bottom: 14px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }

    .card-title {
      font-size: var(--text-md);
      font-weight: 750;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Form Fields */
    .config-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
    }

    .field-label {
      font-size: var(--text-base);
      font-weight: 700;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    select,
    input[type="text"],
    input[type="number"] {
      width: 100%;
      height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: var(--text-base);
      background: var(--bg-surface);
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    select:focus,
    input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.15);
    }

    /* Chart Type Grid Selector */
    .chart-type-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 4px;
    }

    .chart-type-btn {
      padding: 8px 6px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: var(--text-xs);
      font-weight: 700;
      color: var(--text-secondary);
      transition: all 0.15s ease;
      font-family: var(--font-sans);
    }

    .chart-type-btn .icon {
      font-size: 16px;
    }

    .chart-type-btn:hover {
      background: var(--bg-muted);
      border-color: var(--brand);
      color: var(--brand);
    }

    .chart-type-btn.active {
      background: var(--brand-subtle);
      border-color: var(--brand);
      color: var(--brand);
      box-shadow: 0 0 0 1px var(--brand);
    }

    /* Filter Row Grid */
    .filter-row-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* KPI Summary Cards */
    .kpi-deck {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .kpi-card {
      background: var(--bg-muted);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      border: 1px solid var(--border-subtle);
    }

    .kpi-label {
      font-size: var(--text-xs);
      font-weight: 700;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      margin-bottom: 2px;
    }

    .kpi-val {
      font-size: var(--text-md);
      font-weight: 800;
      color: var(--text-primary);
      font-family: var(--font-mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Canvas Container */
    .chart-canvas-container {
      position: relative;
      height: 380px;
      width: 100%;
      background: #ffffff;
      border-radius: var(--radius-md);
      padding: 10px;
    }

    /* Table Leaderboard Preview */
    .preview-table-container {
      max-height: 220px;
      overflow-y: auto;
      overflow-x: auto;
      margin-top: 14px;
      border-radius: var(--radius-md);
    }

    .preview-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .preview-table th {
      background: var(--bg-muted);
      padding: 8px 12px;
      font-size: var(--text-xs);
      font-weight: 750;
      color: var(--text-secondary);
      position: sticky;
      top: 0;
      border-bottom: 1px solid var(--border-subtle);
      z-index: 2;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .preview-table td {
      padding: 8px 12px;
      border-top: 1px solid var(--border-subtle);
      font-size: var(--text-base);
      vertical-align: middle;
    }

    .preview-table tr:hover {
      background: var(--bg-hover);
    }

    /* Buttons */
    .btn {
      font-family: var(--font-sans);
      font-size: var(--text-base);
      font-weight: 600;
      line-height: 1;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      white-space: nowrap;
      user-select: none;
    }

    .btn-primary {
      background-color: var(--brand);
      color: var(--text-inverse);
      box-shadow: var(--shadow-xs);
    }

    .btn-primary:hover {
      background-color: var(--brand-hover);
    }

    .btn-success {
      background-color: var(--success);
      color: var(--text-inverse);
      box-shadow: var(--shadow-xs);
    }

    .btn-success:hover {
      background-color: var(--success-hover);
    }

    .btn-secondary {
      background-color: var(--bg-surface);
      color: var(--text-secondary);
      border-color: var(--border-strong);
    }

    .btn-secondary:hover {
      background-color: var(--bg-muted);
      color: var(--text-primary);
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: var(--text-xs);
      border-radius: 4px;
    }

    /* Toast */
    #toast {
      display: none;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 14px;
      font-weight: 600;
      font-size: var(--text-base);
      box-shadow: var(--shadow-sm);
      animation: slideIn 0.2s ease-out;
    }

    .toast-success {
      background: var(--success-subtle);
      color: var(--success-text);
      border: 1px solid #a7f3d0;
    }

    .toast-error {
      background: var(--danger-subtle);
      color: var(--danger-text);
      border: 1px solid #fecaca;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Loading Overlay */
    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(2px);
      z-index: 9999999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 10px;
      font-weight: 700;
      color: var(--text-primary);
      font-size: var(--text-base);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border-subtle);
      border-top: 3px solid var(--brand);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 900px) {
      .builder-layout {
        grid-template-columns: 1fr;
      }

      .kpi-deck {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay" aria-live="assertive" role="alert">
    <div class="spinner"></div>
    <div id="loadingText">Đang phân tích dữ liệu...</div>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="app-title-group">
      <h1 class="app-title">Trình Tạo Biểu Đồ & Báo Cáo Phân Tích</h1>
      <span class="app-badge">No-Code BI Engine</span>
    </div>
    <div style="display: flex; gap: 8px;">
      <button type="button" class="btn btn-secondary" onclick="exportChartImage()">
        Tải Ảnh Chart (PNG)
      </button>
      <button type="button" class="btn btn-success" onclick="insertNativeChartToSheet()">
        Chèn Biểu Đồ Vào Google Sheets
      </button>
    </div>
  </header>

  <!-- Toast -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Main Layout -->
  <div class="builder-layout">

    <!-- CỘT TRÁI: BẢNG ĐIỀU KHIỂN CẤU HÌNH BIỂU ĐỒ -->
    <aside class="card" aria-labelledby="configPanelTitle">
      <div class="card-header">
        <h2 class="card-title" id="configPanelTitle">Thiết Lập Chỉ Số</h2>
        <button type="button" class="btn btn-sm btn-secondary" onclick="resetConfig()">Mặc định</button>
      </div>

      <!-- 1. CHỌN DIMENSION (TRỤC X / DANH MỤC PHÂN TÍCH) -->
      <div class="config-group">
        <label class="field-label" for="dimensionSelect">Trục Phân Tích (Dimension / Trục X)</label>
        <select id="dimensionSelect" onchange="runAggregation()">
          <optgroup label="Dự Án & Sản Phẩm">
            <option value="duAn" selected>Dự án (Cột F)</option>
            <option value="sanPham">Sản phẩm (Cao Tầng / Thấp Tầng - Cột O)</option>
            <option value="loaiCan">Loại căn (1PN, 2PN, Duplex... - Cột Q)</option>
            <option value="loaiQuy">Loại Quỹ (Quỹ NW / Quỹ Chéo - Cột Z)</option>
            <option value="quyGoc">Quỹ Gốc (NW, RVH, VSR... - Cột N)</option>
            <option value="mien">Miền (Bắc / Nam - Cột E)</option>
            <option value="cdt">Chủ Đầu Tư (CĐT - Cột W)</option>
          </optgroup>
          <optgroup label="Nhân Sự & Phòng Ban">
            <option value="cvkd">Chuyên Viên Kinh Doanh (CVKD - Cột I)</option>
            <option value="pkd">Phòng Kinh Doanh (PKD - Cột H)</option>
            <option value="tpkd">Trưởng Phòng KD (TPKD - Cột S)</option>
            <option value="gdkd">Giám Đốc KD (GĐKD - Cột T)</option>
          </optgroup>
          <optgroup label="Thời Gian">
            <option value="thang">Tháng (Cột C)</option>
            <option value="nam">Năm (Cột D)</option>
            <option value="ngayBc">Ngày Báo Cáo (Cột A)</option>
          </optgroup>
        </select>
      </div>

      <!-- 2. CHỌN METRIC (CHỈ SỐ ĐO LƯỜNG) -->
      <div class="config-group">
        <label class="field-label" for="metricSelect">Chỉ Số Đo Lường (Metric / Trục Y)</label>
        <select id="metricSelect" onchange="runAggregation()">
          <option value="diem" selected>Điểm CVKD (Cột AA / X)</option>
          <option value="count">Số Lượng Căn Đã Bán (Đếm giao dịch)</option>
          <option value="giaVat">Doanh Số Gồm VAT (Cột L)</option>
          <option value="giaChuaVat">Doanh Số Chưa VAT (Cột K)</option>
        </select>
      </div>

      <!-- 3. PHÉP TÍNH GOM NHÓM (AGGREGATION) -->
      <div class="config-group">
        <label class="field-label" for="aggSelect">Phép Tính Tổng Hợp (Aggregation)</label>
        <select id="aggSelect" onchange="runAggregation()">
          <option value="SUM" selected>SUM (Tổng cộng)</option>
          <option value="COUNT">COUNT (Đếm số dòng)</option>
          <option value="AVG">AVERAGE (Giá trị trung bình)</option>
          <option value="MAX">MAX (Giá trị lớn nhất)</option>
          <option value="MIN">MIN (Giá trị nhỏ nhất)</option>
          <option value="DISTINCT_COUNT">DISTINCT COUNT (Đếm duy nhất)</option>
        </select>
      </div>

      <!-- 4. LOẠI BIỂU ĐỒ (CHART TYPE) -->
      <div class="config-group">
        <label class="field-label">Loại Biểu Đồ (Chart Type)</label>
        <div class="chart-type-grid">
          <button type="button" class="chart-type-btn active" data-type="bar_v" onclick="setChartType('bar_v', this)">
            Cột đứng
          </button>
          <button type="button" class="chart-type-btn" data-type="bar_h" onclick="setChartType('bar_h', this)">
            Thanh ngang
          </button>
          <button type="button" class="chart-type-btn" data-type="line" onclick="setChartType('line', this)">
            Đường
          </button>
          <button type="button" class="chart-type-btn" data-type="doughnut" onclick="setChartType('doughnut', this)">
            Donut
          </button>
          <button type="button" class="chart-type-btn" data-type="pie" onclick="setChartType('pie', this)">
            Tròn
          </button>
          <button type="button" class="chart-type-btn" data-type="area" onclick="setChartType('area', this)">
            Vùng
          </button>
        </div>
      </div>

      <!-- 5. BỘ LỌC DỮ LIỆU & TOP N -->
      <div class="config-group">
        <label class="field-label">Bộ Lọc Dữ Liệu</label>
        <div class="filter-row-grid">
          <div>
            <label class="field-label" style="font-size:11px;" for="filterYear">Năm</label>
            <select id="filterYear" onchange="runAggregation()">
              <option value="*">Tất cả năm</option>
              <option value="2026">2026</option>
              <option value="2025">2025</option>
              <option value="2024">2024</option>
              <option value="2023">2023</option>
            </select>
          </div>
          <div>
            <label class="field-label" style="font-size:11px;" for="filterQuy">Loại Quỹ</label>
            <select id="filterQuy" onchange="runAggregation()">
              <option value="*">Tất cả quỹ</option>
              <option value="Quỹ NW">Quỹ NW</option>
              <option value="Quỹ Chéo">Quỹ Chéo</option>
            </select>
          </div>
        </div>
      </div>

      <div class="config-group">
        <div class="filter-row-grid">
          <div>
            <label class="field-label" style="font-size:11px;" for="filterStatus">Trạng Thái</label>
            <select id="filterStatus" onchange="runAggregation()">
              <option value="Đã bán" selected>Đã bán</option>
              <option value="*">Tất cả trạng thái</option>
            </select>
          </div>
          <div>
            <label class="field-label" style="font-size:11px;" for="topNSelect">Hiển Thị Top N</label>
            <select id="topNSelect" onchange="runAggregation()">
              <option value="10" selected>Top 10</option>
              <option value="5">Top 5</option>
              <option value="15">Top 15</option>
              <option value="20">Top 20</option>
              <option value="all">Tất cả</option>
            </select>
          </div>
        </div>
      </div>

      <div class="config-group">
        <label class="field-label" for="chartTitleInput">Tiêu Đề Biểu Đồ</label>
        <input type="text" id="chartTitleInput" placeholder="Tự động sinh theo cấu hình..."
          oninput="updateChartTitle()">
      </div>

    </aside>

    <!-- CỘT PHẢI: LIVE CHART CANVAS & LEADERBOARD TABLE -->
    <main class="card" aria-labelledby="previewTitle" style="margin-bottom: 0;">
      <div class="card-header">
        <h2 class="card-title" id="previewTitle">Xem Trước Biểu Đồ (Live Preview)</h2>
        <span class="app-badge" id="dataPointsCount">0 mục</span>
      </div>

      <!-- KPI Deck -->
      <div class="kpi-deck">
        <div class="kpi-card">
          <div class="kpi-label">Tổng Chỉ Số (Total)</div>
          <div class="kpi-val" id="kpiTotal">0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Trung Bình (Average)</div>
          <div class="kpi-val" id="kpiAvg">0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Cao Nhất (Highest)</div>
          <div class="kpi-val" id="kpiMax">-</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Tổng Số Nhóm (Groups)</div>
          <div class="kpi-val" id="kpiGroups">0</div>
        </div>
      </div>

      <!-- Live Chart Canvas -->
      <div class="chart-canvas-container">
        <canvas id="liveChartCanvas"></canvas>
      </div>

      <!-- Bảng Tổng Hợp Chi Tiết -->
      <div class="preview-table-container">
        <table class="preview-table" aria-label="Bảng tóm tắt dữ liệu biểu đồ">
          <thead>
            <tr>
              <th style="width: 50px;">Hạng</th>
              <th id="thDimensionName">Trục Phân Tích</th>
              <th id="thMetricName" style="text-align: right;">Giá Trị</th>
              <th style="width: 90px; text-align: right;">Tỷ Trọng (%)</th>
            </tr>
          </thead>
          <tbody id="previewTableBody">
            <tr>
              <td colspan="4" style="text-align: center; color: var(--text-tertiary); padding: 16px;">Đang tính toán
                biểu đồ...</td>
            </tr>
          </tbody>
        </table>
      </div>

    </main>
  </div>

  <!-- Chart.js 4.4.1 Script Tag -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <script>
    let rawSheetData = [];
    let currentChartInstance = null;
    let selectedChartType = 'bar_v';
    let currentAggregatedResult = null;

    // Palette màu trực quan chuyên nghiệp
    const chartPalette = [
      '#2563eb', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899',
      '#06b6d4', '#f97316', '#6366f1', '#14b8a6', '#84cc16',
      '#3b82f6', '#059669', '#d97706', '#7c3aed', '#db2777'
    ];

    window.addEventListener('DOMContentLoaded', function () {
      fetchRawDataAndRender();
    });

    function showToast(msg, isError) {
      const toast = document.getElementById('toast');
      toast.className = isError ? 'toast-error' : 'toast-success';
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(function () { toast.style.display = 'none'; }, 3500);
    }

    function showLoading(text) {
      const overlay = document.getElementById('loadingOverlay');
      document.getElementById('loadingText').innerText = text || 'Đang xử lý...';
      overlay.style.display = 'flex';
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').style.display = 'none';
    }

    function setChartType(type, btnEl) {
      selectedChartType = type;
      document.querySelectorAll('.chart-type-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      renderChart();
    }

    function fetchRawDataAndRender() {
      showLoading('Đang tải dữ liệu từ Sheet Data...');
      google.script.run
        .withSuccessHandler(function (data) {
          hideLoading();
          rawSheetData = data || [];
          runAggregation();
        })
        .withFailureHandler(function (err) {
          hideLoading();
          showToast('Lỗi tải dữ liệu: ' + (err.message || err), true);
        })
        .fetchDataForChartBuilder();
    }

    function runAggregation() {
      if (!rawSheetData || rawSheetData.length === 0) return;

      const dimKey = document.getElementById('dimensionSelect').value;
      const metricKey = document.getElementById('metricSelect').value;
      const aggFunc = document.getElementById('aggSelect').value;
      const filterYear = document.getElementById('filterYear').value;
      const filterQuy = document.getElementById('filterQuy').value;
      const filterStatus = document.getElementById('filterStatus').value;
      const topN = document.getElementById('topNSelect').value;

      // 1. Áp dụng bộ lọc
      const filtered = rawSheetData.filter(row => {
        if (filterYear !== '*' && String(row.nam) !== filterYear) return false;
        if (filterQuy !== '*' && String(row.loaiQuy) !== filterQuy) return false;
        if (filterStatus !== '*' && String(row.trangThai).toLowerCase() !== filterStatus.toLowerCase()) return false;
        return true;
      });

      // 2. Gom nhóm theo Dimension
      const groups = {};
      const distinctTracker = {};

      filtered.forEach(row => {
        let dimVal = row[dimKey];
        if (dimVal === undefined || dimVal === null || String(dimVal).trim() === '') {
          dimVal = '(Chưa phân loại)';
        } else {
          dimVal = String(dimVal).trim();
        }

        let metricNum = 0;
        if (metricKey === 'count') {
          metricNum = 1;
        } else if (metricKey === 'diem') {
          metricNum = parseFloat(row.diem) || 0;
        } else if (metricKey === 'giaVat') {
          metricNum = parseFloat(row.giaVat) || 0;
        } else if (metricKey === 'giaChuaVat') {
          metricNum = parseFloat(row.giaChuaVat) || 0;
        }

        if (!groups[dimVal]) {
          groups[dimVal] = { sum: 0, count: 0, max: -Infinity, min: Infinity, values: [] };
          distinctTracker[dimVal] = new Set();
        }

        groups[dimVal].sum += metricNum;
        groups[dimVal].count += 1;
        groups[dimVal].max = Math.max(groups[dimVal].max, metricNum);
        groups[dimVal].min = Math.min(groups[dimVal].min, metricNum);
        groups[dimVal].values.push(metricNum);

        // Distinct tracking
        if (row.maCan) distinctTracker[dimVal].add(row.maCan);
      });

      // 3. Tính toán giá trị theo phép tính
      let result = Object.keys(groups).map(dimName => {
        const g = groups[dimName];
        let finalVal = 0;
        if (aggFunc === 'SUM') finalVal = g.sum;
        else if (aggFunc === 'COUNT') finalVal = g.count;
        else if (aggFunc === 'AVG') finalVal = g.count > 0 ? (g.sum / g.count) : 0;
        else if (aggFunc === 'MAX') finalVal = g.max === -Infinity ? 0 : g.max;
        else if (aggFunc === 'MIN') finalVal = g.min === Infinity ? 0 : g.min;
        else if (aggFunc === 'DISTINCT_COUNT') finalVal = distinctTracker[dimName] ? distinctTracker[dimName].size : 0;

        return {
          dimension: dimName,
          value: finalVal
        };
      });

      // 4. Sắp xếp giảm dần theo giá trị
      result.sort((a, b) => b.value - a.value);

      // 5. Cắt Top N
      let slicedResult = result;
      if (topN !== 'all') {
        const n = parseInt(topN, 10);
        if (!isNaN(n) && n > 0) {
          slicedResult = result.slice(0, n);
        }
      }

      currentAggregatedResult = {
        dimensionKey: dimKey,
        metricKey: metricKey,
        aggFunc: aggFunc,
        data: slicedResult,
        totalItems: result.length
      };

      updateKpis(result);
      renderChart();
      renderTable(slicedResult);
    }

    function formatNumberFriendly(val, isCurrency) {
      if (val === undefined || val === null || isNaN(val)) return '0';
      if (isCurrency) {
        if (Math.abs(val) >= 1e9) return (val / 1e9).toFixed(2) + ' tỷ đ';
        if (Math.abs(val) >= 1e6) return (val / 1e6).toFixed(1) + ' tr đ';
        return val.toLocaleString('vi-VN') + ' đ';
      }
      if (Math.abs(val) >= 1000) return val.toLocaleString('vi-VN');
      return Number.isInteger(val) ? val.toString() : val.toFixed(2);
    }

    function updateKpis(allData) {
      const isCurrency = (document.getElementById('metricSelect').value.includes('gia'));
      const total = allData.reduce((acc, cur) => acc + cur.value, 0);
      const avg = allData.length > 0 ? total / allData.length : 0;
      const maxItem = allData[0] ? `${allData[0].dimension} (${formatNumberFriendly(allData[0].value, isCurrency)})` : '-';

      document.getElementById('kpiTotal').innerText = formatNumberFriendly(total, isCurrency);
      document.getElementById('kpiAvg').innerText = formatNumberFriendly(avg, isCurrency);
      document.getElementById('kpiMax').innerText = maxItem;
      document.getElementById('kpiGroups').innerText = allData.length;
      document.getElementById('dataPointsCount').innerText = `${allData.length} nhóm`;
    }

    function getDefaultTitle() {
      const dimText = document.getElementById('dimensionSelect').selectedOptions[0].text.split('(')[0].trim();
      const metricText = document.getElementById('metricSelect').selectedOptions[0].text.split('(')[0].trim();
      const aggText = document.getElementById('aggSelect').value;
      return `Thống kê ${aggText} ${metricText} theo ${dimText}`;
    }

    function updateChartTitle() {
      if (currentChartInstance) {
        const titleInput = document.getElementById('chartTitleInput').value.trim();
        currentChartInstance.options.plugins.title.text = titleInput || getDefaultTitle();
        currentChartInstance.update();
      }
    }

    function renderChart() {
      if (!currentAggregatedResult) return;

      const data = currentAggregatedResult.data;
      const labels = data.map(d => d.dimension);
      const values = data.map(d => d.value);
      const isCurrency = currentAggregatedResult.metricKey.includes('gia');
      const titleInput = document.getElementById('chartTitleInput').value.trim() || getDefaultTitle();

      const ctx = document.getElementById('liveChartCanvas').getContext('2d');
      if (currentChartInstance) {
        currentChartInstance.destroy();
      }

      let chartJsType = 'bar';
      let indexAxis = 'x';
      let fillArea = false;

      if (selectedChartType === 'bar_v') {
        chartJsType = 'bar';
        indexAxis = 'x';
      } else if (selectedChartType === 'bar_h') {
        chartJsType = 'bar';
        indexAxis = 'y';
      } else if (selectedChartType === 'line') {
        chartJsType = 'line';
      } else if (selectedChartType === 'area') {
        chartJsType = 'line';
        fillArea = true;
      } else if (selectedChartType === 'doughnut') {
        chartJsType = 'doughnut';
      } else if (selectedChartType === 'pie') {
        chartJsType = 'pie';
      }

      const bgColors = (chartJsType === 'doughnut' || chartJsType === 'pie')
        ? chartPalette.slice(0, values.length)
        : '#2563eb';

      currentChartInstance = new Chart(ctx, {
        type: chartJsType,
        data: {
          labels: labels,
          datasets: [{
            label: currentAggregatedResult.metricKey,
            data: values,
            backgroundColor: bgColors,
            borderColor: (chartJsType === 'line') ? '#2563eb' : 'transparent',
            borderWidth: (chartJsType === 'line') ? 2.5 : 1,
            borderRadius: (chartJsType === 'bar') ? 6 : 0,
            fill: fillArea ? 'origin' : false,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          indexAxis: indexAxis,
          plugins: {
            legend: {
              display: (chartJsType === 'doughnut' || chartJsType === 'pie'),
              position: 'right'
            },
            title: {
              display: true,
              text: titleInput,
              font: { size: 14, weight: '700', family: "'Manrope', sans-serif" },
              color: '#0f172a',
              padding: { bottom: 12 }
            },
            tooltip: {
              callbacks: {
                label: function (context) {
                  const val = context.parsed.y !== undefined ? context.parsed.y : (context.parsed.x !== undefined ? context.parsed.x : context.parsed);
                  return ` Giá trị: ${formatNumberFriendly(val, isCurrency)}`;
                }
              }
            }
          },
          scales: (chartJsType === 'doughnut' || chartJsType === 'pie') ? {} : {
            x: {
              grid: { display: false },
              ticks: { font: { size: 11, family: "'Manrope', sans-serif" } }
            },
            y: {
              grid: { color: '#f1f5f9' },
              ticks: {
                font: { size: 11, family: "'Manrope', sans-serif" },
                callback: function (value) {
                  return formatNumberFriendly(value, isCurrency);
                }
              }
            }
          }
        }
      });
    }

    function renderTable(data) {
      const tbody = document.getElementById('previewTableBody');
      const isCurrency = (document.getElementById('metricSelect').value.includes('gia'));
      const total = data.reduce((acc, cur) => acc + cur.value, 0);

      document.getElementById('thDimensionName').innerText = document.getElementById('dimensionSelect').selectedOptions[0].text.split('(')[0].trim();
      document.getElementById('thMetricName').innerText = document.getElementById('metricSelect').selectedOptions[0].text.split('(')[0].trim();

      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--text-tertiary); padding: 16px;">Không có dữ liệu phù hợp bộ lọc.</td></tr>';
        return;
      }

      tbody.innerHTML = data.map((d, idx) => {
        const pct = total > 0 ? ((d.value / total) * 100).toFixed(1) + '%' : '0%';
        const rankBadge = idx < 3
          ? `<span style="display:inline-block; width:22px; height:22px; background:#e0e7ff; color:#3730a3; border-radius:50%; text-align:center; font-weight:800; font-size:11px; line-height:22px;">${idx + 1}</span>`
          : `<span style="color:#64748b; font-weight:600; margin-left:6px;">${idx + 1}</span>`;

        return `
          <tr>
            <td>${rankBadge}</td>
            <td style="font-weight:600; color:var(--text-primary);">${d.dimension}</td>
            <td style="text-align:right; font-weight:700; font-family:var(--font-mono); color:var(--brand);">${formatNumberFriendly(d.value, isCurrency)}</td>
            <td style="text-align:right; font-weight:600; color:var(--text-tertiary);">${pct}</td>
          </tr>
        `;
      }).join('');
    }

    function resetConfig() {
      document.getElementById('dimensionSelect').value = 'duAn';
      document.getElementById('metricSelect').value = 'diem';
      document.getElementById('aggSelect').value = 'SUM';
      document.getElementById('filterYear').value = '*';
      document.getElementById('filterQuy').value = '*';
      document.getElementById('filterStatus').value = 'Đã bán';
      document.getElementById('topNSelect').value = '10';
      document.getElementById('chartTitleInput').value = '';
      setChartType('bar_v', document.querySelector('[data-type="bar_v"]'));
      runAggregation();
    }

    function exportChartImage() {
      if (!currentChartInstance) return;
      const a = document.createElement('a');
      a.href = currentChartInstance.toBase64Image('image/png', 1.0);
      a.download = `BieuDo_${document.getElementById('dimensionSelect').value}_${Date.now()}.png`;
      a.click();
      showToast('Đã xuất ảnh biểu đồ thành công!', false);
    }

    function insertNativeChartToSheet() {
      if (!currentAggregatedResult || !currentAggregatedResult.data.length) {
        showToast('Không có dữ liệu để tạo biểu đồ!', true);
        return;
      }

      showLoading('Đang tạo Sheet Dashboard và chèn Biểu đồ Native...');

      const payload = {
        title: document.getElementById('chartTitleInput').value.trim() || getDefaultTitle(),
        dimensionName: document.getElementById('dimensionSelect').selectedOptions[0].text.split('(')[0].trim(),
        metricName: document.getElementById('metricSelect').selectedOptions[0].text.split('(')[0].trim(),
        chartType: selectedChartType,
        data: currentAggregatedResult.data
      };

      google.script.run
        .withSuccessHandler(function (res) {
          hideLoading();
          if (res && res.success) {
            showToast(`Đã tạo thành công biểu đồ tại sheet "${res.sheetName}"!`, false);
          } else {
            showToast('Lỗi tạo biểu đồ: ' + (res.error || 'Không xác định'), true);
          }
        })
        .withFailureHandler(function (err) {
          hideLoading();
          showToast('Lỗi server: ' + (err.message || err), true);
        })
        .createNativeChartInSheet(payload);
    }
  </script>
